[project]
name = "advanced-ml"
version = "0.1.0"
description = "Advanced Machine Learning - DTU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "miniproject1",
    "miniproject2",
    "miniproject3",
    "numpy>=2.4.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "scipy>=1.17.0",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[tool.uv.workspace]
members = ["miniproject1", "miniproject2", "miniproject3"]

[tool.uv.sources]
miniproject1 = { workspace = true }
miniproject2 = { workspace = true }
miniproject3 = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["miniproject1", "miniproject2", "miniproject3"]
